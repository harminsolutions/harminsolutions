<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3248"/><stop offset="0.55" stop-color="#154d64"/><stop offset="1" stop-color="#0a2133"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#183f5a"/><stop offset="1" stop-color="#0d1d31"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe8f3"/><stop offset="1" stop-color="#1da8d5"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="900" height="520" rx="26" fill="url(#bg)"/>
<ellipse cx="318" cy="258" rx="238" ry="140" fill="#52d7ef" opacity="0.13" filter="url(#blur)"/>
<ellipse cx="645" cy="166" rx="142" ry="92" fill="#52d7ef" opacity="0.10" filter="url(#blur)"/>

